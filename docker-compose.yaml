services:
  keybr:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    volumes:
      - ./data:/root/.local/state/keybr
    ports:
      - "30044:3000"
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: dashboard.Dockerfile
    volumes:
      - ./data:/data
    environment:
      - DATA_DIR=/data
      - PORT=3001
      - ADMIN_CODE=${ADMIN_CODE}
    ports:
      - "30045:3001"
    restart: unless-stopped
    depends_on:
      - keybr
